{% extends "base.html" %}

{% block head %}
    {{ super() }}
    <!-- 🌸 Ad Script (Head Zone) -->
    <script>(function(s){s.dataset.zone='10127605',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        .paste-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .paste-header {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 1.2rem;
        }

        .paste-content {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
        }

        .ad-banner {
            margin: 30px 0;
            text-align: center;
        }

        body {
            background-color: #f1f5f9;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="paste-container">
        <div class="paste-header"></div>

        <!-- 🌸 Banner Ad (mid-content) -->
        <div class="ad-banner">
            <script async="async" data-cfasync="false" src="//tearingtastes.com/c9199a7c30b6128ca4b29eed8a267391/invoke.js"></script>
            <div id="container-c9199a7c30b6128ca4b29eed8a267391"></div>
        </div>

        <div class="paste-content">
            {{ content | safe }}
        </div>
    </div>
{% endblock %}
