{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<h2>Atur Password Baru 🔐</h2>

{% if msg %}
  <div style="background:#dcfce7; color:#166534; padding:0.8rem; border-radius:8px; margin-bottom:1rem;">
    {{ msg }}
  </div>
{% endif %}

{% if error %}
  <div style="background:#fee2e2; color:#b91c1c; padding:0.8rem; border-radius:8px; margin-bottom:1rem;">
    ⚠️ {{ error }}
  </div>
{% endif %}

<form method="post" action="/reset-password">
  <label>Password Baru</label>
  <input type="password" name="password" required>

  <!-- Hidden access_token -->
  <input type="hidden" name="access_token" id="access_token">

  <button type="submit">Ubah Password</button>
</form>

<script>
  // ambil access_token dari URL fragment (#access_token=...)
  const hash = window.location.hash;
  const params = new URLSearchParams(hash.replace("#", ""));
  const token = params.get("access_token");
  if (token) {
    document.getElementById("access_token").value = token;
    history.replaceState(null, "", window.location.pathname); // bersihkan hash
  }
</script>
{% endblock %}
