{% extends "base.html" %}
{% block content %}
<h2>Lupa Password 💭</h2>
<form method="post">
  <label>Email</label>
  <input type="email" name="email" required>
  <button type="submit">Kirim Link Reset</button>
</form>
{% if msg %}<p style="color:green;">{{ msg }}</p>{% endif %}
{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
{% endblock %}
