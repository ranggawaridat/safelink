{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<h2>Admin Dashboard</h2>

<h3>Statistik Global</h3>
<ul>
  <li>Total Klik: {{ stats.total_clicks }}</li>
</ul>

<h3>Daftar User</h3>
<table>
  <tr><th>Email</th><th>Role</th></tr>
  {% for u in users %}
  <tr>
    <td>{{ u.email }}</td>
    <td>{{ u.role }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
