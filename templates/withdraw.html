<!DOCTYPE html>
<html>
<head>
  <title>Withdraw</title>
  <style>
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    h2 { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>💵 Withdraw Balance</h1>

  <p>Saldo kamu: <strong>${{ "%.2f"|format(balance) }}</strong></p>

  <form method="post" action="/withdraw">
    <label>Email PayPal:</label><br>
    <input type="email" name="paypal_email" required><br><br>

    <label>Jumlah ($):</label><br>
    <input type="number" name="amount" step="0.01" required><br><br>

    <button type="submit">Kirim Permintaan Withdraw</button>
  </form>

  <h2>Riwayat Withdraw</h2>
  <table>
    <tr><th>Tanggal</th><th>Jumlah</th><th>Status</th></tr>
    {% for w in withdrawals %}
      <tr>
        <td>{{ w.created_at }}</td>
        <td>${{ "%.2f"|format(w.amount) }}</td>
        <td>{{ w.status }}</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
