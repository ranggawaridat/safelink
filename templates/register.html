{% extends "base.html" %}
{% block content %}
<h3>Register</h3>
<form method="post">
  <label>Email:</label><br>
  <input type="email" name="email" required><br>
  <label>Password:</label><br>
  <input type="password" name="password" required><br><br>
  <button type="submit">Register</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}
{% endblock %}
